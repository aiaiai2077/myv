name: Obfuscate and Commit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  obfuscate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Obfuscate code
        run: npm run obfuscate

      - name: Ensure required KV binding
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "wrangler.toml";
          const lines = fs.readFileSync(path, "utf8").split(/\r?\n/);
          const kept = [];

          for (let index = 0; index < lines.length; index += 1) {
            if (/^\s*\[\[kv_namespaces\]\]\s*$/.test(lines[index])) {
              index += 1;
              while (
                index < lines.length &&
                !/^\s*\[/.test(lines[index])
              ) {
                index += 1;
              }
              index -= 1;
              continue;
            }
            kept.push(lines[index]);
          }

          const template = `${kept.join("\n").trimEnd()}\n\n[[kv_namespaces]]\nbinding = "KV"\n`;
          fs.writeFileSync(path, template);
          console.log("Ensured wrangler.toml contains a binding-only KV template.");
          NODE

      - name: Commit and push obfuscated worker to v1
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/v1 > /tmp/v1-ref; then
            git fetch origin refs/heads/v1:refs/remotes/origin/v1
            git worktree add -b v1 output refs/remotes/origin/v1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              cat /tmp/v1-ref
              exit "$status"
            fi
            git worktree add --detach output HEAD
            git -C output switch --orphan v1
          fi
          git -C output ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              _worker.js|wrangler.toml) ;;
              *) git -C output rm -f -- "$file" ;;
            esac
          done
          git -C output clean -fdx
          cp _worker.js output/_worker.js
          cp wrangler.toml output/wrangler.toml
          sed -i 's|^main = .*|main = "_worker.js"|' output/wrangler.toml
          grep -q '^main = "_worker.js"$' output/wrangler.toml
          git -C output config user.email "github-actions[bot]@users.noreply.github.com"
          git -C output config user.name "github-actions[bot]"
          git -C output add _worker.js wrangler.toml
          if git -C output diff --cached --quiet; then
            echo "No changes to push"
            exit 0
          fi
          git -C output commit -m "Obfuscate _worker.js"
          git -C output push origin HEAD:v1

      - name: Deploy to Cloudflare accounts
        env:
          CLOUDFLARE_DEPLOY_TARGETS: ${{ secrets.CLOUDFLARE_DEPLOY_TARGETS }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");

          const rawAccounts = process.env.CLOUDFLARE_DEPLOY_TARGETS?.replace(/^\uFEFF/, "").trim();
          if (!rawAccounts) {
            console.error(
              "CLOUDFLARE_DEPLOY_TARGETS is empty or unavailable. Check that the repository Actions secret exists with this exact name; environment secrets require assigning that environment to this job.",
            );
            process.exit(1);
          }

          let accounts;
          try {
            accounts = JSON.parse(rawAccounts);
          } catch {
            console.error(
              "CLOUDFLARE_DEPLOY_TARGETS is not valid JSON. Store the raw JSON array (double quotes, no surrounding single quotes or code fences) as the secret.",
            );
            process.exit(1);
          }

          if (
            !Array.isArray(accounts) ||
            accounts.length < 1 ||
            accounts.some(
              (account) =>
                !account ||
                typeof account.accountId !== "string" ||
                !/^[a-f\d]{32}$/i.test(account.accountId) ||
                typeof account.apiToken !== "string" ||
                !account.apiToken.trim(),
            )
          ) {
            console.error(
              "CLOUDFLARE_DEPLOY_TARGETS must be a non-empty array of objects with 32-character hexadecimal accountId and non-empty apiToken strings.",
            );
            process.exit(1);
          }

          async function cloudflareRequest(account, pathname, options = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${pathname}`, {
              ...options,
              headers: {
                Authorization: `Bearer ${account.apiToken}`,
                "Content-Type": "application/json",
                ...options.headers,
              },
            });
            let body;
            try {
              body = await response.json();
            } catch {
              throw new Error(`Cloudflare API returned a non-JSON response (HTTP ${response.status}).`);
            }
            if (!response.ok || !body.success) {
              const details = Array.isArray(body.errors)
                ? body.errors.map((error) => `${error.code}: ${error.message}`).join("; ")
                : "No error details were returned.";
              throw new Error(`Cloudflare API request failed (HTTP ${response.status}): ${details}`);
            }
            return body;
          }

          async function ensureNamespace(account) {
            const basePath = `/accounts/${encodeURIComponent(account.accountId)}/storage/kv/namespaces`;
            async function findNamespace() {
              for (let page = 1; ; page += 1) {
                const list = await cloudflareRequest(
                  account,
                  `${basePath}?page=${page}&per_page=1000`,
                );
                if (!Array.isArray(list.result)) {
                  throw new Error(`Cloudflare returned an invalid KV namespace list for account ${account.accountId}.`);
                }
                const existing = list.result.find((namespace) => namespace.title === "myv-kv");
                if (existing) {
                  return existing.id;
                }
                const totalPages = Number(list.result_info?.total_pages ?? page);
                if (page >= totalPages) {
                  return null;
                }
              }
            }

            const existingId = await findNamespace();
            if (existingId) {
              console.log(`Found myv-kv in account ${account.accountId}.`);
              return existingId;
            }

            try {
              const created = await cloudflareRequest(account, basePath, {
                method: "POST",
                body: JSON.stringify({ title: "myv-kv" }),
              });
              if (!created.result?.id) {
                throw new Error(`Cloudflare created myv-kv without returning a namespace ID for account ${account.accountId}.`);
              }
              console.log(`Created myv-kv in account ${account.accountId}.`);
              return created.result.id;
            } catch (error) {
              const createdByAnotherRun = await findNamespace();
              if (createdByAnotherRun) {
                console.log(`Found myv-kv in account ${account.accountId} after a concurrent create.`);
                return createdByAnotherRun;
              }
              throw error;
            }
          }

          function runWrangler(configPath, account) {
            return new Promise((resolve, reject) => {
              const child = spawnSync(
                "npx",
                ["wrangler", "deploy", "--config", configPath],
                {
                  stdio: "inherit",
                  env: {
                    ...process.env,
                    CLOUDFLARE_API_TOKEN: account.apiToken,
                    CLOUDFLARE_ACCOUNT_ID: account.accountId,
                  },
                },
              );
              if (child.error) {
                reject(new Error("Wrangler deployment failed to start."));
              } else if (child.status !== 0) {
                reject(new Error(`Wrangler deployment failed with status ${child.status ?? "unknown"}.`));
              } else {
                resolve();
              }
            });
          }

          async function main() {
            const templatePath = path.join("output", "wrangler.toml");
            const template = fs.readFileSync(templatePath, "utf8");
            const failedAccounts = [];
            const lines = template.split(/\r?\n/);
            const kvBlocks = [];
            for (let start = 0; start < lines.length; start += 1) {
              if (!/^\s*\[\[kv_namespaces\]\]\s*$/.test(lines[start])) {
                continue;
              }
              let end = start + 1;
              while (end < lines.length && !/^\s*\[/.test(lines[end])) {
                end += 1;
              }
              const block = lines.slice(start, end).join("\n");
              const binding = block.match(/^\s*binding\s*=\s*"([^"]+)"\s*$/m);
              kvBlocks.push({
                start,
                end,
                binding: binding?.[1],
                hasId: /^\s*id\s*=/m.test(block),
              });
              start = end - 1;
            }

            if (
              kvBlocks.length !== 1 ||
              kvBlocks[0].binding !== "KV" ||
              kvBlocks[0].hasId
            ) {
              throw new Error("output/wrangler.toml must contain exactly one binding-only KV namespace template with no ID.");
            }

            for (let index = 0; index < accounts.length; index += 1) {
              const account = accounts[index];
              console.log(`Preparing deployment to Cloudflare account ${index + 1}...`);
              try {
                const namespaceId = await ensureNamespace(account);
                if (!/^[\da-f]{32}$/i.test(namespaceId)) {
                  throw new Error(`Cloudflare returned an invalid KV namespace ID for account ${account.accountId}.`);
                }

                const deployLines = [...lines];
                deployLines.splice(
                  kvBlocks[0].start,
                  kvBlocks[0].end - kvBlocks[0].start,
                  "[[kv_namespaces]]",
                  'binding = "KV"',
                  `id = ${JSON.stringify(namespaceId)}`,
                );
                const deployConfig = `${deployLines.join("\n").replace(/\n*$/, "")}\n`;
                const deployConfigPath = path.join("output", `.wrangler-deploy-${index + 1}.toml`);
                fs.writeFileSync(deployConfigPath, deployConfig);
                try {
                  await runWrangler(deployConfigPath, account);
                } finally {
                  fs.rmSync(deployConfigPath, { force: true });
                }
                console.log(`Deployment to account ${account.accountId} succeeded.`);
              } catch (error) {
                console.error(`Deployment to account ${account.accountId} failed: ${error.message}`);
                failedAccounts.push(account.accountId);
              }
            }

            if (failedAccounts.length > 0) {
              throw new Error(`Deployment failed for account(s): ${failedAccounts.join(", ")}`);
            }
          }

          main().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
