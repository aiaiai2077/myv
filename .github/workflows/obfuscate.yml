name: Obfuscate and Commit

on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
  workflow_dispatch:

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Obfuscate code
        run: npm run obfuscate

      - name: Commit and push obfuscated worker to v1
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/v1 > /tmp/v1-ref; then
            git fetch origin refs/heads/v1:refs/remotes/origin/v1
            git worktree add -b v1 output refs/remotes/origin/v1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              cat /tmp/v1-ref
              exit "$status"
            fi
            git worktree add --detach output HEAD
            git -C output switch --orphan v1
          fi
          git -C output ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              _worker.js|wrangler.toml) ;;
              *) git -C output rm -f -- "$file" ;;
            esac
          done
          git -C output clean -fdx
          cp _worker.js output/_worker.js
          cp wrangler.toml output/wrangler.toml
          sed -i 's|^main = .*|main = "_worker.js"|' output/wrangler.toml
          grep -q '^main = "_worker.js"$' output/wrangler.toml
          git -C output config user.email "github-actions[bot]@users.noreply.github.com"
          git -C output config user.name "github-actions[bot]"
          git -C output add _worker.js wrangler.toml
          if git -C output diff --cached --quiet; then
            echo "No changes to push"
            exit 0
          fi
          git -C output commit -m "Obfuscate _worker.js"
          git -C output push origin HEAD:v1

      - name: Deploy to Cloudflare accounts
        env:
          CF_ACCOUNTS_JSON: ${{ secrets.CF_ACCOUNTS_JSON }}
        run: |
          node <<'NODE'
          const { spawnSync } = require("node:child_process");

          const rawAccounts = process.env.CF_ACCOUNTS_JSON?.replace(/^\uFEFF/, "").trim();
          if (!rawAccounts) {
            console.error(
              "CF_ACCOUNTS_JSON is empty or unavailable. Check that the repository Actions secret exists with this exact name; environment secrets require assigning that environment to this job.",
            );
            process.exit(1);
          }

          let accounts;
          try {
            accounts = JSON.parse(rawAccounts);
          } catch {
            console.error(
              "CF_ACCOUNTS_JSON is not valid JSON. Store the raw JSON array (double quotes, no surrounding single quotes or code fences) as the secret.",
            );
            process.exit(1);
          }

          if (
            !Array.isArray(accounts) ||
            accounts.length !== 3 ||
            accounts.some(
              (account) =>
                !account ||
                typeof account.accountId !== "string" ||
                !account.accountId.trim() ||
                typeof account.apiToken !== "string" ||
                !account.apiToken.trim(),
            )
          ) {
            console.error(
              "CF_ACCOUNTS_JSON must be an array of exactly 3 objects with non-empty accountId and apiToken strings.",
            );
            process.exit(1);
          }

          for (let index = 0; index < accounts.length; index += 1) {
            console.log(`Deploying to Cloudflare account ${index + 1}...`);
            const result = spawnSync(
              "npx",
              ["wrangler", "deploy", "--config", "output/wrangler.toml"],
              {
                stdio: "inherit",
                env: {
                  ...process.env,
                  CLOUDFLARE_API_TOKEN: accounts[index].apiToken,
                  CLOUDFLARE_ACCOUNT_ID: accounts[index].accountId,
                },
              },
            );

            if (result.error) {
              console.error(`Deployment ${index + 1} failed to start.`);
              process.exit(1);
            }
            if (result.status !== 0) {
              process.exit(result.status ?? 1);
            }
          }
          NODE
