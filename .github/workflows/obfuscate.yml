name: Obfuscate and Commit
on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  obfuscate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Obfuscate code
        run: npm run obfuscate

      - name: Ensure required KV binding
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "wrangler.toml";
          const lines = fs.readFileSync(path, "utf8").split(/\r?\n/);
          const kept = [];

          for (let index = 0; index < lines.length; index += 1) {
            if (/^\s*\[\[kv_namespaces\]\]\s*$/.test(lines[index])) {
              index += 1;
              while (
                index < lines.length &&
                !/^\s*\[/.test(lines[index])
              ) {
                index += 1;
              }
              index -= 1;
              continue;
            }
            kept.push(lines[index]);
          }

          const template = `${kept.join("\n").trimEnd()}\n\n[[kv_namespaces]]\nbinding = "KV"\n`;
          fs.writeFileSync(path, template);
          console.log("Ensured wrangler.toml contains a binding-only KV template.");
          NODE

      - name: Commit and push obfuscated worker to v1
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/v1 > /tmp/v1-ref; then
            git fetch origin refs/heads/v1:refs/remotes/origin/v1
            git worktree add -b v1 output refs/remotes/origin/v1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              cat /tmp/v1-ref
              exit "$status"
            fi
            git worktree add --detach output HEAD
            git -C output switch --orphan v1
          fi
          git -C output ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              _worker.js|wrangler.toml) ;;
              *) git -C output rm -f -- "$file" ;;
            esac
          done
          git -C output clean -fdx
          cp _worker.js output/_worker.js
          cp wrangler.toml output/wrangler.toml
          sed -i 's|^main = .*|main = "_worker.js"|' output/wrangler.toml
          grep -q '^main = "_worker.js"$' output/wrangler.toml
          git -C output config user.email "github-actions[bot]@users.noreply.github.com"
          git -C output config user.name "github-actions[bot]"
          git -C output add _worker.js wrangler.toml
          if git -C output diff --cached --quiet; then
            echo "No changes to push"
            exit 0
          fi
          git -C output commit -m "Obfuscate _worker.js"
          git -C output push origin HEAD:v1

      - name: Deploy to all Cloudflare accounts (auto myv-kv)
        env:
          CLOUDFLARE_DEPLOY_TARGETS: ${{ secrets.CLOUDFLARE_DEPLOY_TARGETS }}
        run: |
          if [[ -z "$CLOUDFLARE_DEPLOY_TARGETS" ]] ||
            ! jq -e 'type == "array" and length >= 1 and all(.[]; (.accountId | type == "string" and test("^[a-fA-F0-9]{32}$")) and (.apiToken | type == "string" and length > 0))' <<<"$CLOUDFLARE_DEPLOY_TARGETS" >/dev/null; then
            echo "::error::Secret CLOUDFLARE_DEPLOY_TARGETS 必须是JSON数组，示例：[{\"accountId\":\"xxx\",\"apiToken\":\"xxx\"}]"
            exit 1
          fi

          # 重点：读取 worktree output 里面的 toml，不是仓库根目录
          source_config="$GITHUB_WORKSPACE/output/wrangler.toml"
          failed_accounts=()

          while IFS= read -r target; do
            account_id=$(jq -r '.accountId' <<<"$target")
            api_token=$(jq -r '.apiToken' <<<"$target")
            echo "::add-mask::$api_token"
            echo "==== Deploy to account $account_id ===="

            # 复制临时toml，用于注入KV id
            config="$RUNNER_TEMP/wrangler-$account_id.toml"
            cp "$source_config" "$config"

            # 1. 查询该账号下所有KV，找title=myv-kv
            namespaces=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $api_token" \
              "https://api.cloudflare.com/client/v4/accounts/$account_id/storage/kv/namespaces?per_page=1000") || {
                echo "::error::拉取KV列表失败 $account_id"
                failed_accounts+=("$account_id")
                continue
              }

            namespace_id=$(jq -r '[.result[] | select(.title == "myv-kv")][0].id // empty' <<<"$namespaces")

            # 2. 不存在则新建 myv-kv
            if [[ -z "$namespace_id" ]]; then
              echo "myv-kv 不存在，正在创建..."
              namespace_response=$(curl --fail-with-body --silent --show-error \
                --request POST \
                --header "Authorization: Bearer $api_token" \
                --header "Content-Type: application/json" \
                --data '{"title":"myv-kv"}' \
                "https://api.cloudflare.com/client/v4/accounts/$account_id/storage/kv/namespaces") || {
                  echo "::error::创建myv-kv失败 $account_id"
                  failed_accounts+=("$account_id")
                  continue
                }
              namespace_id=$(jq -r '.result.id' <<<"$namespace_response")
            fi
            echo "✅ KV namespace id: $namespace_id"

            # 3. 脚本注入 id = "xxx" 到 binding = "KV" 那一行下方
            python3 - "$config" "$namespace_id" <<'PY'
import re
import sys
from pathlib import Path

config_path = Path(sys.argv[1])
namespace_id = sys.argv[2]
config_text = config_path.read_text(encoding="utf-8")
lines = config_text.splitlines(keepends=True)

current_table = None
binding_line = None

for index, line in enumerate(lines):
    table_match = re.match(r"^[ \t]*\[\[([^\]]+)\]\][ \t]*(?:#.*)?$", line.rstrip("\r\n"))
    if table_match:
        current_table = table_match.group(1)
    elif re.match(r"^[ \t]*\[[^\[].*\][ \t]*(?:#.*)?$", line.rstrip("\r\n")):
        current_table = None
    elif (
        current_table == "kv_namespaces"
        and re.match(r'^[ \t]*binding[ \t]*=[ \t]*"KV"[ \t]*(?:#.*)?$', line.rstrip("\r\n"))
    ):
        binding_line = index

if binding_line is None:
    raise SystemExit("❌ 在wrangler.toml找不到 [[kv_namespaces]] + binding = \"KV\"")

newline = "\r\n" if lines[binding_line].endswith("\r\n") else "\n"
lines.insert(binding_line + 1, f'id = "{namespace_id}"{newline}')
config_path.write_text("".join(lines), encoding="utf-8")
PY

            # 4. 使用注入好KV id的临时配置部署
            echo "🚀 wrangler deploy start"
            if CLOUDFLARE_ACCOUNT_ID="$account_id" \
              CLOUDFLARE_API_TOKEN="$api_token" \
              npx --yes wrangler@4 deploy --config "$config"; then
              echo "✅ $account_id 部署成功"
            else
              echo "::error::$account_id 部署失败"
              failed_accounts+=("$account_id")
            fi
          done < <(jq -c '.[]' <<<"$CLOUDFLARE_DEPLOY_TARGETS")

          if (( ${#failed_accounts[@]} > 0 )); then
            echo "::error::部署失败账号：${failed_accounts[*]}"
            exit 1
          fi
