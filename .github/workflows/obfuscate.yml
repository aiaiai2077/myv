name: Obfuscate and Commit

on:
  push:
    branches: [main]
    paths:
      - '_worker.js'
  workflow_dispatch:

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Obfuscate code
        run: npm run obfuscate

      - name: Commit and push obfuscated worker to v1
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/v1 > /tmp/v1-ref; then
            git fetch origin refs/heads/v1:refs/remotes/origin/v1
            git worktree add -b v1 output refs/remotes/origin/v1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              cat /tmp/v1-ref
              exit "$status"
            fi
            git worktree add --detach output HEAD
            git -C output switch --orphan v1
          fi
          git -C output ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              _worker.js|wrangler.toml) ;;
              *) git -C output rm -f -- "$file" ;;
            esac
          done
          git -C output clean -fdx
          cp _worker.js output/_worker.js
          cp wrangler.toml output/wrangler.toml
          sed -i 's|^main = .*|main = "_worker.js"|' output/wrangler.toml
          grep -q '^main = "_worker.js"$' output/wrangler.toml
          git -C output config user.email "github-actions[bot]@users.noreply.github.com"
          git -C output config user.name "github-actions[bot]"
          git -C output add _worker.js wrangler.toml
          if git -C output diff --cached --quiet; then
            echo "No changes to push"
            exit 0
          fi
          git -C output commit -m "Obfuscate _worker.js"
          git -C output push origin HEAD:v1

      - name: Upload Worker script to Cloudflare accounts
        env:
          CLOUDFLARE_DEPLOY_TARGETS: ${{ secrets.CLOUDFLARE_DEPLOY_TARGETS }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const rawAccounts = process.env.CLOUDFLARE_DEPLOY_TARGETS?.replace(/^\uFEFF/, "").trim();
          if (!rawAccounts) {
            console.error(
              "CLOUDFLARE_DEPLOY_TARGETS is empty or unavailable. Check that the repository Actions secret exists with this exact name; environment secrets require assigning that environment to this job.",
            );
            process.exit(1);
          }

          let accounts;
          try {
            accounts = JSON.parse(rawAccounts);
          } catch {
            console.error(
              "CLOUDFLARE_DEPLOY_TARGETS is not valid JSON. Store the raw JSON array (double quotes, no surrounding single quotes or code fences) as the secret.",
            );
            process.exit(1);
          }

          if (
            !Array.isArray(accounts) ||
            accounts.length !== 3 ||
            accounts.some(
              (account) =>
                !account ||
                typeof account.accountId !== "string" ||
                !account.accountId.trim() ||
                typeof account.apiToken !== "string" ||
                !account.apiToken.trim(),
            )
          ) {
            console.error(
              "CLOUDFLARE_DEPLOY_TARGETS must be an array of exactly 3 objects with non-empty accountId and apiToken strings.",
            );
            process.exit(1);
          }

          const config = await readFile("wrangler.toml", "utf8");
          function getStringSetting(name) {
            const match = config.match(
              new RegExp(`^${name}\\s*=\\s*("(?:\\\\.|[^"\\\\])*")\\s*$`, "m"),
            );
            if (!match) {
              throw new Error(`Missing or unsupported Wrangler setting: ${name}`);
            }
            return JSON.parse(match[1]);
          }

          const bindings = [];
          const varsHeader = config.match(/^\[vars\]\s*$/m);
          if (varsHeader && varsHeader.index !== undefined) {
            const varsStart = varsHeader.index + varsHeader[0].length;
            const remainingConfig = config.slice(varsStart);
            const nextSectionOffset = remainingConfig.search(/^\[/m);
            const varsText =
              nextSectionOffset < 0
                ? remainingConfig
                : remainingConfig.slice(0, nextSectionOffset);
            for (const line of varsText.split(/\r?\n/)) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith("#")) continue;
              const match = trimmed.match(
                /^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*("(?:\\.|[^"\\])*")\s*(?:#.*)?$/,
              );
              if (!match) {
                throw new Error(
                  "Unsupported [vars] entry in wrangler.toml; refusing upload to avoid changing Worker bindings.",
                );
              }
              bindings.push({
                type: "plain_text",
                name: match[1],
                text: JSON.parse(match[2]),
              });
            }
          }

          const scriptName = getStringSetting("name");
          const script = await readFile("output/_worker.js");
          const metadata = {
            main_module: "_worker.js",
            compatibility_date: getStringSetting("compatibility_date"),
            bindings,
          };

          for (let index = 0; index < accounts.length; index += 1) {
            console.log(`Uploading Worker script to Cloudflare account ${index + 1}...`);
            const form = new FormData();
            form.append(
              "metadata",
              new Blob([JSON.stringify(metadata)], { type: "application/json" }),
              "metadata.json",
            );
            form.append(
              "_worker.js",
              new Blob([script], { type: "application/javascript+module" }),
              "_worker.js",
            );

            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accounts[index].accountId)}/workers/scripts/${encodeURIComponent(scriptName)}`,
              {
                method: "PUT",
                headers: {
                  Authorization: `Bearer ${accounts[index].apiToken}`,
                },
                body: form,
              },
            );
            let result;
            try {
              result = await response.json();
            } catch {
              console.error(
                `Cloudflare returned HTTP ${response.status} with a non-JSON response for account ${index + 1}.`,
              );
              process.exit(1);
            }
            if (!response.ok || !result || result.success !== true) {
              const errors = Array.isArray(result.errors)
                ? result.errors.map((error) => error.message).join("; ")
                : "Unknown Cloudflare API error";
              console.error(
                `Script upload failed for account ${index + 1} (HTTP ${response.status}): ${errors}`,
              );
              process.exit(1);
            }
          }
          NODE
